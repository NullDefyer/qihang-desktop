name: Build Windows installer

# Build artifacts only. This workflow never automatically creates a public Release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm test -- --test-concurrency=1
      - run: npm run build:installer
      - run: npm run test:sites
      - uses: actions/upload-artifact@v4
        with:
          name: qihang-windows-installer
          path: |
            release/Qihang-Setup-*.exe
            release/Qihang-Setup-*.exe.blockmap
          if-no-files-found: error
          retention-days: 14
