name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check public source
        run: npm run check:public
      - name: Functional tests
        run: npm test -- --test-concurrency=1
      - name: Build web and desktop assets
        run: npm run build
      - name: Verify static preview packaging
        run: npm run test:sites
